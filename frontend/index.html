<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">
    <h2>❤️ Heart Disease Risk Prediction</h2>

    <form action="/predict" method="POST">

        <div class="form-grid">

            <div>
                <label>Age</label>
                <input type="number" name="age" required>
            </div>

            <div>
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div>
                <label>Cholesterol</label>
                <input type="number" name="cholesterol" required>
            </div>

            <div>
                <label>Blood Pressure</label>
                <input type="number" name="blood_pressure" required>
            </div>

            <div>
                <label>Heart Rate</label>
                <input type="number" name="heart_rate" required>
            </div>

            <div>
                <label>Smoking</label>
                <select name="smoking" required>
                    <option value="">Select</option>
                    <option value="Never">Never</option>
                    <option value="Current">Current</option>
                    <option value="Former">Former</option>
                </select>
            </div>

            <div>
                <label>Alcohol Intake</label>
                <select name="alcohol_intake" required>
                    <option value="">Select</option>
                    <option value="Non Alcoholic">Non Alcoholic</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Heavy">Heavy</option>
                </select>
            </div>

            <div>
                <label>Exercise Hours</label>
                <input type="number" step="0.1" name="exercise_hours" required>
            </div>

            <div>
                <label>Family History</label>
                <select name="family_history" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div>
                <label>Diabetes</label>
                <select name="diabetes" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div>
                <label>Obesity</label>
                <select name="obesity" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div>
                <label>Stress Level (1-10)</label>
                <input type="number" name="stress_level" min="1" max="10" required>
            </div>

            <div>
                <label>Blood Sugar</label>
                <input type="number" name="blood_sugar" required>
            </div>

            <div>
                <label>Exercise Induced Angina</label>
                <select name="exercise_induced_angina" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div>
                <label>Chest Pain Type</label>
                <select name="chest_pain_type" required>
                    <option value="">Select</option>
                    <option value="Typical Angina">Typical Angina</option>
                    <option value="Atypical Angina">Atypical Angina</option>
                    <option value="Non-anginal Pain">Non-anginal Pain</option>
                    <option value="Asymptomatic">Asymptomatic</option>
                </select>
            </div>

        </div>

        <button type="submit" class="btn">
            Analyze Risk
        </button>

    </form>

</div>

</body>
</html>
